[build]
target = "x86_64-oxidebsd.json"

[alias]
# `-vv` is the only verbosity level that shows a build script's own raw stdout (every `make`/
# `configure` subprocess build.rs shells out to, e.g. the musl/BusyBox/TinyCC builds) live in the
# terminal instead of silently buffering it until/unless the build script itself fails -- see
# `[term] verbose` above (deliberately absent): that key is boolean-only, equivalent to a single
# `-v`, and still hides this output; Cargo also refuses to let `[alias]` redefine a built-in
# command name outright, so plain `cargo build`/`cargo test` can't be made to do this by default.
# These are opt-in shortcuts instead.
bv = "build -vv"
tv = "test -vv"
rv = "run -vv"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true
panic-abort-tests = true

[target.'cfg(target_os = "none")']
runner = "bootimage runner"

[target.x86_64-oxidebsd]
# Forces `chacha20`'s own runtime-cpufeatures-detected SIMD backend selection (avx2/sse2, chosen
# via `cfg_if!` in that crate's own `src/backends.rs`) down to its plain scalar "soft" backend --
# this target disables SSE/MMX entirely (see CLAUDE.md's custom-target-spec section), and without
# this, `rustc`'s own vector-op legalization has nothing to lower those SIMD code paths to at all
# (a real, not just theoretical, `rustc-LLVM ERROR: Do not know how to split the result of this
# operator!` -- found bringing up src/random.rs's ChaCha20-backed /dev/urandom). `sha2`'s own
# analogous flag (`force-soft`, see this crate's own Cargo.toml) is a real Cargo feature instead of
# a raw `--cfg`, so it doesn't need duplicating here.
rustflags = ["--cfg", "chacha20_backend=\"soft\""]
